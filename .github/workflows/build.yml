name: Build

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build backend
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o cartepro .

      - name: Assemble artifact
        run: |
          mkdir -p artifact/frontend artifact/backend
          cp -r frontend/dist artifact/frontend/dist
          cp backend/cartepro artifact/backend/cartepro
          cp .env.example artifact/.env.example
          cp .github/ARTIFACT_README.md artifact/README.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cartepro-build-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
